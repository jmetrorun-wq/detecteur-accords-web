<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ChordSplit">
  <meta name="theme-color" content="#1E1E2E">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <title>ChordSplit</title>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
</head>
<body>

<div id="app">

  <!-- ════════════════════════ ÉCRAN UPLOAD ════════════════════════ -->
  <section id="screen-upload" class="screen active">
    <div class="upload-center">
      <div class="app-logo">🎵</div>
      <h1 class="app-title">ChordSplit</h1>
      <p class="app-subtitle">Détectez les accords et séparez les pistes de n'importe quelle chanson</p>

      <label class="btn-upload" for="file-input">
        <span class="btn-icon">📂</span>
        Choisir un fichier audio
      </label>
      <input type="file" id="file-input" accept="audio/*,.mp3,.wav,.flac,.ogg,.oga,.opus,.m4a,.aac,.aiff,.aif,.wma" style="display:none">

      <button type="button" id="btn-record" class="btn-secondary">
        <span class="btn-icon">🎤</span>
        Enregistrer en direct
      </button>

      <p class="format-hint">MP3 · M4A · WAV · FLAC · OGG · AAC · AIFF · WMA</p>

      <div class="upload-divider">ou</div>

      <form id="youtube-form" class="youtube-form">
        <input type="url" id="youtube-url" class="youtube-input" placeholder="Lien YouTube" required>
        <button type="submit" class="btn-youtube">Analyser</button>
      </form>
    </div>
  </section>

  <!-- ═════════════════ ÉCRAN ENREGISTREMENT (façon Shazam) ═════════ -->
  <section id="screen-record" class="screen">
    <button id="btn-record-cancel" class="btn-icon-only record-cancel" title="Annuler">✕</button>
    <div class="record-center">
      <div class="record-pulse-wrap">
        <span class="record-pulse-ring"></span>
        <span class="record-pulse-ring record-pulse-ring2"></span>
        <div class="record-pulse-dot">🎤</div>
      </div>
      <p class="record-title">Écoute en cours…</p>
      <p id="record-timer" class="record-timer">0:00</p>
      <button type="button" id="btn-record-stop" class="btn-upload">Arrêter et analyser</button>
    </div>
  </section>

  <!-- ════════════════════════ ÉCRAN CHARGEMENT ════════════════════ -->
  <section id="screen-loading" class="screen">
    <div class="loading-center">
      <div class="spinner"></div>
      <p class="loading-title">Analyse en cours…</p>
      <p id="loading-sub" class="loading-sub">Préparation…</p>
      <div class="loading-progress-wrap">
        <div class="loading-progress-bar">
          <div id="loading-progress-fill" class="loading-progress-fill"></div>
        </div>
        <span id="loading-progress-label" class="loading-progress-label">0 %</span>
      </div>
      <p id="loading-filename" class="loading-file"></p>
    </div>
  </section>

  <!-- ════════════════════════ ÉCRAN RÉSULTATS ════════════════════ -->
  <section id="screen-results" class="screen">

    <!-- En-tête résultats -->
    <header class="results-header">
      <button id="btn-back" class="btn-icon-only" title="Nouvelle analyse">←</button>
      <div class="header-info">
        <span id="info-key" class="badge-key"></span>
        <span id="info-tempo" class="badge-tempo"></span>
      </div>
      <div class="header-transpose">
        <button id="btn-tr-down" class="btn-small">−♭</button>
        <span id="tr-label" class="tr-label">±0</span>
        <button id="btn-tr-up" class="btn-small">+♯</button>
      </div>
      <button id="btn-export-pdf" class="btn-icon-only" title="Exporter en PDF">📄</button>
      <button id="btn-separate" class="btn-icon-only" title="Séparer les pistes">🎚️</button>
    </header>

    <!-- Barre défilante des accords (une case par temps, façon Chordify) -->
    <div id="chord-list" class="chord-list"></div>

    <!-- Accord courant (gros) -->
    <div id="current-chord-box" class="current-chord-box">
      <div id="current-chord" class="current-chord">—</div>
      <div id="current-type" class="current-type"></div>
    </div>

    <!-- Piano : une octave zoomée sur l'accord joué -->
    <div class="piano-wrap">
      <canvas id="piano-canvas" class="piano-canvas"></canvas>
    </div>

    <!-- Diagramme guitare -->
    <div id="guitar-wrap" class="guitar-wrap">
      <svg id="guitar-svg" class="guitar-svg" viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="guitar-label" class="guitar-label"></div>
    </div>

    <!-- Lecteur audio -->
    <div class="player-bar">
      <button id="btn-play" class="btn-play" aria-label="Lecture/Pause">▶</button>
      <span id="time-current" class="time-label">0:00</span>
      <input type="range" id="seek-bar" class="seek-bar" min="0" max="100" value="0" step="0.1">
      <span id="time-total" class="time-label">0:00</span>
    </div>

    <!-- Séparation de pistes -->
    <div id="separate-panel" class="separate-panel hidden">
      <div id="separate-progress-wrap" class="separate-progress-wrap hidden">
        <div class="separate-progress-bar">
          <div id="separate-progress-fill" class="separate-progress-fill"></div>
        </div>
        <span id="separate-progress-label" class="separate-progress-label">0%</span>
      </div>
      <div id="separate-error" class="separate-error hidden"></div>
      <div id="separate-stems" class="separate-stems hidden">
        <div class="separate-stem" data-stem="vocals">
          <span class="stem-label">Voix</span>
          <audio class="stem-audio" controls preload="none"></audio>
          <a class="stem-download" title="Télécharger">⬇</a>
        </div>
        <div class="separate-stem" data-stem="drums">
          <span class="stem-label">Batterie</span>
          <audio class="stem-audio" controls preload="none"></audio>
          <a class="stem-download" title="Télécharger">⬇</a>
        </div>
        <div class="separate-stem" data-stem="bass">
          <span class="stem-label">Basse</span>
          <audio class="stem-audio" controls preload="none"></audio>
          <a class="stem-download" title="Télécharger">⬇</a>
        </div>
        <div class="separate-stem" data-stem="other">
          <span class="stem-label">Autre</span>
          <audio class="stem-audio" controls preload="none"></audio>
          <a class="stem-download" title="Télécharger">⬇</a>
        </div>
        <button id="btn-reanalyze-other" class="btn-youtube">Ré-analyser les accords sans batterie/voix</button>
      </div>
    </div>

  </section>

</div><!-- #app -->

<audio id="audio-player" preload="none"></audio>

<script src="/static/piano.js?v={{ asset_version }}"></script>
<script src="/static/guitar.js?v={{ asset_version }}"></script>
<script src="/static/app.js?v={{ asset_version }}"></script>
</body>
</html>
